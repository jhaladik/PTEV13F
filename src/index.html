<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Divergence Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"], textarea {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        button {
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.1em;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            margin-top: 25px;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .stock-symbol {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .score-badge {
            font-size: 2.5em;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 12px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .score-high { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .score-medium { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .score-low { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }

        .metric-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .metric-label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .metric-change {
            font-size: 0.9em;
            margin-top: 5px;
        }

        .positive { color: #38ef7d; }
        .negative { color: #f5576c; }

        .signals {
            margin-top: 25px;
        }

        .signals-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .signal {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f8f9fa;
        }

        .signal-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85em;
            white-space: nowrap;
        }

        .signal-STRONG_BUY { background: #38ef7d; color: white; }
        .signal-BUY { background: #4facfe; color: white; }
        .signal-WATCH { background: #f5576c; color: white; }
        .signal-VALUE { background: #764ba2; color: white; }
        .signal-MOMENTUM { background: #f093fb; color: white; }

        .signal-reason {
            flex: 1;
            color: #666;
            line-height: 1.6;
        }

        .batch-results {
            margin-top: 25px;
        }

        .batch-summary {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .batch-stat {
            flex: 1;
            text-align: center;
        }

        .batch-stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .batch-stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .stock-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stock-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .error {
            background: #fff5f5;
            border-left: 4px solid #f5576c;
            padding: 15px;
            border-radius: 8px;
            color: #c53030;
            margin-top: 20px;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 8px;
            color: #1565c0;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .timestamp {
            font-size: 0.85em;
            color: #999;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .stock-header {
                flex-direction: column;
                gap: 15px;
            }

            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Stock Divergence Analyzer</h1>
            <p class="subtitle">Find undervalued opportunities where price diverges from fundamentals</p>
        </header>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('single')">Single Stock</button>
                <button class="tab" onclick="switchTab('batch')">Batch Analysis</button>
            </div>

            <!-- Single Stock Tab -->
            <div id="single-tab" class="tab-content active">
                <div class="info-box">
                    Enter a stock symbol (e.g., AKBA, AAPL, MSFT) to analyze price divergence from fundamentals
                </div>
                <div class="search-box">
                    <input type="text" id="symbol-input" placeholder="Enter stock symbol (e.g., AKBA)" onkeypress="handleEnter(event)">
                    <button onclick="analyzeStock()">Analyze</button>
                </div>
                <div id="single-result"></div>
            </div>

            <!-- Batch Analysis Tab -->
            <div id="batch-tab" class="tab-content">
                <div class="info-box">
                    Enter multiple stock symbols separated by commas or line breaks (max 50 stocks)
                </div>
                <textarea id="batch-input" placeholder="Enter symbols: AKBA, AAPL, MSFT&#10;or one per line"></textarea>
                <div style="margin-top: 10px;">
                    <button onclick="analyzeBatch()">Analyze Batch</button>
                </div>
                <div id="batch-result"></div>
            </div>
        </div>
    </div>

    <script>
        // API endpoint - change this after deployment
        const API_BASE = window.location.origin;

        function switchTab(tab) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            document.querySelector(`#${tab}-tab`).classList.add('active');
            event.target.classList.add('active');
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                analyzeStock();
            }
        }

        async function analyzeStock() {
            const input = document.getElementById('symbol-input');
            const symbol = input.value.trim().toUpperCase();
            const resultDiv = document.getElementById('single-result');

            if (!symbol) {
                resultDiv.innerHTML = '<div class="error">Please enter a stock symbol</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing ' + symbol + '...</div>';

            try {
                const response = await fetch(`${API_BASE}/analyze?symbol=${symbol}`);
                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                resultDiv.innerHTML = renderStockResult(data);
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Failed to fetch data: ${error.message}</div>`;
            }
        }

        async function analyzeBatch() {
            const input = document.getElementById('batch-input');
            const text = input.value.trim();
            const resultDiv = document.getElementById('batch-result');

            if (!text) {
                resultDiv.innerHTML = '<div class="error">Please enter stock symbols</div>';
                return;
            }

            // Parse symbols (comma or newline separated)
            const symbols = text.split(/[,\n]/)
                .map(s => s.trim().toUpperCase())
                .filter(s => s.length > 0);

            if (symbols.length === 0) {
                resultDiv.innerHTML = '<div class="error">No valid symbols found</div>';
                return;
            }

            if (symbols.length > 50) {
                resultDiv.innerHTML = '<div class="error">Maximum 50 symbols allowed</div>';
                return;
            }

            resultDiv.innerHTML = `<div class="loading"><div class="spinner"></div>Analyzing ${symbols.length} stocks...</div>`;

            try {
                const response = await fetch(`${API_BASE}/batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbols })
                });

                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                resultDiv.innerHTML = renderBatchResults(data);
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Failed to fetch data: ${error.message}</div>`;
            }
        }

        function renderStockResult(data) {
            const scoreClass = data.divergenceScore >= 70 ? 'score-high' :
                             data.divergenceScore >= 50 ? 'score-medium' : 'score-low';

            const priceChangeClass = data.data.price.change90dPct < 0 ? 'negative' : 'positive';
            const priceChangeIcon = data.data.price.change90dPct < 0 ? '▼' : '▲';

            let html = '<div class="result">';

            // Header with symbol and score
            html += '<div class="stock-header">';
            html += `<div class="stock-symbol">${data.symbol}</div>`;
            html += `<div class="score-badge ${scoreClass}">${data.divergenceScore}</div>`;
            html += '</div>';

            // Metrics grid
            html += '<div class="metrics-grid">';

            html += `
                <div class="metric-card">
                    <div class="metric-label">Current Price</div>
                    <div class="metric-value">$${data.data.price.current.toFixed(2)}</div>
                    ${data.data.price.change90dPct !== null ? `
                        <div class="metric-change ${priceChangeClass}">
                            ${priceChangeIcon} ${Math.abs(data.data.price.change90dPct).toFixed(2)}% (90d)
                        </div>
                    ` : ''}
                </div>
            `;

            if (data.data.valuation.marketCap) {
                html += `
                    <div class="metric-card">
                        <div class="metric-label">Market Cap</div>
                        <div class="metric-value">$${formatNumber(data.data.valuation.marketCap)}</div>
                    </div>
                `;
            }

            if (data.data.valuation.evToRevenue) {
                html += `
                    <div class="metric-card">
                        <div class="metric-label">EV/Revenue</div>
                        <div class="metric-value">${data.data.valuation.evToRevenue.toFixed(2)}</div>
                    </div>
                `;
            }

            if (data.data.valuation.peRatio) {
                html += `
                    <div class="metric-card">
                        <div class="metric-label">P/E Ratio</div>
                        <div class="metric-value">${data.data.valuation.peRatio.toFixed(2)}</div>
                    </div>
                `;
            }

            if (data.data.valuation.priceToSales) {
                html += `
                    <div class="metric-card">
                        <div class="metric-label">Price/Sales</div>
                        <div class="metric-value">${data.data.valuation.priceToSales.toFixed(2)}</div>
                    </div>
                `;
            }

            if (data.data.valuation.priceToBook) {
                html += `
                    <div class="metric-card">
                        <div class="metric-label">Price/Book</div>
                        <div class="metric-value">${data.data.valuation.priceToBook.toFixed(2)}</div>
                    </div>
                `;
            }

            html += '</div>';

            // Signals
            if (data.signals && data.signals.length > 0) {
                html += '<div class="signals">';
                html += '<div class="signals-title">Trading Signals</div>';
                data.signals.forEach(signal => {
                    html += `
                        <div class="signal">
                            <span class="signal-badge signal-${signal.type}">${signal.type.replace('_', ' ')}</span>
                            <span class="signal-reason">${signal.reason}</span>
                        </div>
                    `;
                });
                html += '</div>';
            }

            // Timestamp
            html += `<div class="timestamp">Analyzed at ${new Date(data.timestamp).toLocaleString()} (${data.processingTime}ms)</div>`;

            html += '</div>';
            return html;
        }

        function renderBatchResults(data) {
            let html = '<div class="batch-results">';

            // Summary
            html += '<div class="batch-summary">';
            html += `
                <div class="batch-stat">
                    <div class="batch-stat-value">${data.total}</div>
                    <div class="batch-stat-label">Total</div>
                </div>
                <div class="batch-stat">
                    <div class="batch-stat-value">${data.successful}</div>
                    <div class="batch-stat-label">Successful</div>
                </div>
                <div class="batch-stat">
                    <div class="batch-stat-value">${data.failed}</div>
                    <div class="batch-stat-label">Failed</div>
                </div>
            `;
            html += '</div>';

            // Sort by divergence score (highest first)
            const sortedResults = [...data.results]
                .filter(r => r.status === 'fulfilled')
                .sort((a, b) => b.data.divergenceScore - a.data.divergenceScore);

            // Render each stock
            sortedResults.forEach(result => {
                if (result.status === 'fulfilled') {
                    const stockData = result.data;
                    const scoreClass = stockData.divergenceScore >= 70 ? 'score-high' :
                                     stockData.divergenceScore >= 50 ? 'score-medium' : 'score-low';

                    html += '<div class="stock-card">';
                    html += '<div class="stock-header">';
                    html += `<div class="stock-symbol">${stockData.symbol}</div>`;
                    html += `<div class="score-badge ${scoreClass}" style="font-size: 1.5em; padding: 10px 20px;">${stockData.divergenceScore}</div>`;
                    html += '</div>';

                    // Key metrics
                    html += '<div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px;">';
                    html += `<div><strong>Price:</strong> $${stockData.data.price.current.toFixed(2)}</div>`;
                    if (stockData.data.price.change90dPct !== null) {
                        const changeClass = stockData.data.price.change90dPct < 0 ? 'negative' : 'positive';
                        html += `<div><strong>90d Change:</strong> <span class="${changeClass}">${stockData.data.price.change90dPct.toFixed(2)}%</span></div>`;
                    }
                    if (stockData.data.valuation.evToRevenue) {
                        html += `<div><strong>EV/Rev:</strong> ${stockData.data.valuation.evToRevenue.toFixed(2)}</div>`;
                    }
                    if (stockData.data.valuation.peRatio) {
                        html += `<div><strong>P/E:</strong> ${stockData.data.valuation.peRatio.toFixed(2)}</div>`;
                    }
                    html += '</div>';

                    // Top signal
                    if (stockData.signals && stockData.signals.length > 0) {
                        const topSignal = stockData.signals[0];
                        html += `
                            <div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px;">
                                <span class="signal-badge signal-${topSignal.type}">${topSignal.type.replace('_', ' ')}</span>
                                <span style="margin-left: 10px; color: #666;">${topSignal.reason}</span>
                            </div>
                        `;
                    }

                    html += '</div>';
                }
            });

            // Failed stocks
            const failedResults = data.results.filter(r => r.status === 'rejected');
            if (failedResults.length > 0) {
                html += '<div style="margin-top: 20px;"><h3 style="color: #f5576c; margin-bottom: 10px;">Failed Analysis</h3>';
                failedResults.forEach(result => {
                    html += `<div class="error" style="margin-bottom: 10px;"><strong>${result.symbol}:</strong> ${result.error}</div>`;
                });
                html += '</div>';
            }

            html += '</div>';
            return html;
        }

        function formatNumber(num) {
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
            return num.toFixed(2);
        }
    </script>
</body>
</html>
